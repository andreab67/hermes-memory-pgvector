[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-pgvector"
version = "0.5.1"
description = "Postgres + pgvector memory provider plugin for hermes-agent. Multi-agent storage layer with per-minion themes, identity governance, agent attribution + delegation provenance, async writer, no LLM in the memory hot path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Andrea Borghi" },
]
keywords = [
    "hermes-agent",
    "memory-provider",
    "pgvector",
    "postgres",
    "multi-agent",
    "llm-memory",
    "semantic-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

# Runtime dependencies. Upper bounds per the hermes-agent supply-chain
# pinning policy (CONTRIBUTING.md, "Dependency pinning policy").
dependencies = [
    "psycopg[binary]>=3.3.5,<4",
    "psycopg-pool>=3.3.1,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
]

# Operator maintenance CLI (migrate / backfill / prune / stats / cleanup / remap).
# Shipped as source — no built artifacts committed (repo convention).
[project.scripts]
hermes-pgvector = "hermes_pgvector.__main__:main"

# Native plugin discovery. hermes-agent resolves memory providers from bundled
# dirs, then user plugin dirs, then this entry-point group (plugins/memory/
# __init__.py: ENTRY_POINTS_GROUP = "hermes_agent.memory_providers"); the
# loader accepts a module exposing `register(ctx)`, which this package does.
# With this declared, `pip install hermes-memory-pgvector` is sufficient on a
# host new enough to support it -- no discovery shim, and nothing to go stale
# on the next upgrade. The shim generator stays for older hosts, and a shim
# DIRECTORY still wins over the entry point when one is present.
[project.entry-points."hermes_agent.memory_providers"]
pgvector = "hermes_pgvector"

[project.urls]
Homepage      = "https://github.com/andreab67/hermes-memory-pgvector"
Source        = "https://github.com/andreab67/hermes-memory-pgvector"
Issues        = "https://github.com/andreab67/hermes-memory-pgvector/issues"
Roadmap       = "https://github.com/andreab67/hermes-memory-pgvector/blob/main/ROADMAP.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["hermes_pgvector*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
hermes_pgvector = ["plugin.yaml", "migrations/*.sql"]
